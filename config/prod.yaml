# PRODUCTION: real money.
# Credentials: KALSHI_PROD_KEY_ID / KALSHI_PROD_PRIVATE_KEY_PATH
# Live trading requires both flags: klp run -c config/prod.yaml --live --confirm-prod
#
# Strategy (Oct 1, from the first 30h of live logs):
#   1. Commit: stay in a market until it reaches Kalshi's $1 payout. The old setup quoted 397
#      markets in 20h (median stay 10 min); only 2 of 491 ever reached $1.
#   2. Price fills honestly: fills lost ~7c/contract, not the 2c assumed, and fills ate more
#      than the rewards paid. Require rewards to beat expected fill cost by a wide margin.
#   3. Avoid published-number markets (gas, diesel, CPI, rain, token use, YouTube views): they
#      jump on data releases with no warning in their trade history: $8.87 of the $9.88 lost
#      to fills in the main 20h run.
#   4. Concentrate: the 5 best markets (most net $/day, least fill risk) at ~$47 each, so every
#      market clears $1 fast. A fill can cost up to $24 per side, so pick them carefully.
# Reward parameters (Target Size, discount factor, pool, period) come from each
# market's live incentive program; default_* below only apply without one.

environment: prod
dry_run: true
client_order_prefix: klp

loop: # quoting is event-driven off the WebSocket feed
  requote_min_interval_seconds: 0.5 # debounce per requote; less churn
  heartbeat_seconds: 5 # requote everything at least this often
  reconcile_interval_seconds: 15 # REST cross-check of orders/positions/balance
  queue_refresh_seconds: 3 # our queue positions (rank in book, reward tracking)
  reward_report_seconds: 60 # log estimated rewards earned
  reselect_interval_seconds: 300 # rescan every 5 min (was 1 min: markets swapped ~2,400 times/day)
  reselect_on_pause: false # a fill's 5-min pause no longer gives the slot (and its earnings) away
  min_reselect_gap_seconds: 60
  status_check_interval_seconds: 30

rate_limits:
  read_per_sec: 200
  write_per_sec: 100

selection:
  mode: incentives
  fallback_to_volume: false # in prod, only quote markets that pay rewards
  max_markets: 10 # x up to $20 locked each ($10/side via max_loss_per_fill) = ~$200 of the budget
  max_per_series: 1 # unrelated events: one jump can't hit several of our markets at once
  min_seconds_to_close: 21600 # 6h; close_buffer_seconds pulls quotes 2h before close anyway
  min_mid_price: 0.15 # near-decided markets: the cheap side collapses to ~0 on news
  max_mid_price: 0.85 # (fills at 7-10c lost 50-90% of the order: CPI, gas, YouTube views)
  max_spread: 0.08 # wider books have no trustworthy fair value
  min_daily_reward: 0 # off: the payout filter decides
  # The $1 rule. Kalshi pays nothing under $1 per market, so only enter a market projected to
  # pay 2x that by its period end/close (room for pauses and estimate error). Once in, it only
  # needs payout_minimum ($1), so it isn't dropped and re-picked as its estimate wobbles.
  # Programs run in daily periods and the minimum applies to each one: only earnings in
  # the current period count toward these.
  min_period_payout: 2
  payout_minimum: 1
  protect_unpaid: true # leaving a market with unpaid earnings under $1 forfeits them: count that
  competition_weight: 0 # off: rank purely by estimated $/day
  # Fill risk: replay each candidate's last 24h of public trades against the quotes we'd post.
  # Sweeps that would have eaten the queue in front of us = fills; each costs the taker fee to
  # exit plus the move that caused it. Rank by net $/day = reward - fill cost.
  fill_risk: true
  fill_risk_pool: 40 # candidates checked per scan (one trades query each, cached); held first
  trade_lookback_hours: 168 # replay a week of trades (a day was too short: a quiet day read as 0 risk)
  fill_risk_queue_factor: 0.5 # count on only half the queue in front of us: others pull orders
  # before a sweep, so a sweep half the queue's size is treated as reaching us
  sweep_window_seconds: 2 # prints this close together are one sweep: faster than we can react
  taker_fee_rate: 0.07 # Kalshi taker fee: 0.07 x P x (1 - P) per contract
  adverse_move: 0.07 # measured: median 7-8c lost per filled contract on exit (was 0.02)
  min_net_daily_reward: 0
  max_fill_cost_share: 0.15 # expected fills may eat at most 15% of a market's reward: with only
  # 5 markets, take the nearly fill-free ones, then rank them by net $/day
  max_fills_per_day: null # off: "zero fills" missed 8 of 13 real fills and banned the top earner
  catalog_refresh_seconds: 600 # reuse the program/market list for 10 min; books are always fresh
  incumbent_bonus: 0.25 # a newcomer must pay 25%+ more to take a held market's slot
  min_hold_seconds: 14400 # a picked market keeps its slot 4h while it passes the filters
  exclude_tickers: []
  exclude_series: [
      # Sudden-event markets: jump straight through every resting order.
      KXBIGGESTQUAKE, # -$7.87 in one fill: 0.56 -> 0.95 when a quake hit
      KXTRUMPMENTION,
      KXTRUMPMENTIONB,
      KXWORLDNEWSMENTION, # resolves the moment a word appears: same jump as the Trump mentions
      KXTTELITEMATCH, # live table tennis: in-play matches jump with every point
      KXTRUMPSAYCOMPANY,
      # Published-number markets: price jumps when the data comes out. Thin books, so the
      # fill model sees no risk until it happens. Rewards there didn't cover a single fill.
      KXTOKENUSE, # -$2.08: 0.45 -> 0.11
      KXCPIYOY, # -$1.49 (and the rest of the CPI release:)
      KXCPI,
      KXCPICORE,
      KXCPICOREYOY,
      KXAAAGASD, # -$1.47 daily gas price (monthly KXAAAGASMAXM/MINM were fine)
      KXRAIN, # -$1.41 weather observations
      KXYTVIEWSHIGH, # -$1.54
      KXDIESELW, # -$0.59
      KXDIESELMON, # -$0.84
      KXRT, # Rotten Tomatoes score: jumps as reviews land (KXRT-DIG-50: ~1,850 fills/day)
      # Every order rejected (insufficient_shard_balance).
      KXMLBALCSMVP,
      KXMLBNLCSMVP,
    ]

quoting:
  placement: reward
  share_tolerance: 0.4 # accept up to 40% less reward share for a deeper, safer price
  size: 4 # contracts per side when auto_size is off
  auto_size: true # capital to the best markets first, each at max_size (selection estimates at it)
  max_loss_per_fill: 10 # (budget: ignored while scale_with_budget is on) at most $10 locked (and lost, worst case) per side of a market
  # (size <= 10 / price: 20 contracts at 0.50, 50 at 0.20). The only cap that works on jumps.
  max_size: 150 # (budget: ignored while scale_with_budget is on) contracts per side with auto_size: high enough that the $10 cap, not this, binds
  capital_utilization: 0.95 # put 95% of the budget to work
  offset_ticks: 1 # one extra tick behind the reward-optimal price: more queue in front of us
  min_edge: 0.01
  skew_per_contract: 0.005 # 4 contracts held -> quotes shift 2c away
  max_skew: 0.05
  min_price: 0.05
  max_price: 0.95
  one_sided_edge: 0.05
  default_target_size: 500
  default_discount_factor: 0.5
  post_only: true # maker only: never cross the spread with a quote (exits are the only takers)
  min_cushion: 100 # others' contracts ahead of us, capped per market at Target Size / 5 (full credit)
  min_quote_life_seconds: 10 # no reward-chasing moves for 10s (safety moves still immediate)

risk:
  max_capital: 500 # $ cap: position cost + cash locked in resting orders (actual $, per price)
  scale_with_budget: true # size the 6 settings marked (budget) from max_capital: change the budget
  # and they follow. per side = max_capital x 0.95 / (max_markets x 2); see config.budget_scaled
  max_position_per_market: 150 # (budget: ignored while scale_with_budget is on) also caps order size; keep >= quoting.max_size
  max_total_exposure: 40 # (budget: ignored while scale_with_budget is on) with flatten_on_fill, positions only last until the exit fills
  flatten_on_fill: true # never hold shares: on a fill, pull that market's quotes and get out
  # How: a fill comes from a sweep that just emptied the bids, so crossing at once sells at the
  # worst price. On our first 10 measured fills, crossing at once lost $6.33; the price an hour
  # later was ~$3.90 better. So rest an exit at the entry price, and cross only when:
  exit_mode: passive
  unwind_seconds: 900 # ...15 min pass without getting out,
  unwind_stop: 0.05 # ...others offer our side 5c+ below entry (a real move, not an empty bid),
  unwind_giveup: 0 # (rest exactly at entry: break even)
  # ...the bid comes back to the entry, or the market is about to close. Halts, the dashboard's
  # flatten button and shutdown always cross at once.
  flatten_slippage: 0.02 # a crossing exit may trade up to 2c through the best price
  flatten_retry_seconds: 2
  max_session_loss: 20 # (budget: ignored while scale_with_budget is on) halt and cancel everything: 2 worst-case fills, or ~10 typical ones
  # (a typical fill loses ~8c x ~25 contracts = ~$2)
  min_balance: 0 # cash floor; max_capital already bounds what the bot uses
  fill_burst_contracts: 2 # any fill of 2+ contracts pauses that market...
  fill_burst_window_seconds: 300
  cooldown_seconds: 300 # ...for 5 minutes (it keeps its slot)
  close_buffer_seconds: 7200
  max_consecutive_errors: 5
  max_mid_move: 0.04 # mid moves 4c within 60s -> news; pause the market
  mid_move_window_seconds: 60
  order_group_contracts_limit: 300 # (budget: ignored while scale_with_budget is on) exchange-side: >2 full fills (2 x max_size) in 15s cancels
  # everything. Exits are sent outside the group, so flattening never trips it.

logging:
  level: INFO
  file: logs/prod.log
