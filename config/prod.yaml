# PRODUCTION: real money.
# Credentials: KALSHI_PROD_KEY_ID / KALSHI_PROD_PRIVATE_KEY_PATH
# Live trading requires both flags: klp run -c config/prod.yaml --live --confirm-prod
#
# Start small. These limits are intentionally tight; raise them only after
# you have watched the bot's fills and P&L for a while. Suggested progression,
# only moving on once fills, inventory, P&L and rewards reconcile:
#   4 markets / $20  ->  8 markets / $50-100  ->  adaptive sizing, more markets
# Reward parameters (Target Size, discount factor, pool, period) come from each
# market's live incentive program; default_* below only apply without one.

environment: prod
dry_run: true
client_order_prefix: klp

loop: # quoting is event-driven off the WebSocket feed
  requote_min_interval_seconds: 0.5 # debounce per requote; less churn
  heartbeat_seconds: 5 # requote everything at least this often
  reconcile_interval_seconds: 15 # REST cross-check of orders/positions/balance
  queue_refresh_seconds: 3 # our queue positions (rank in book, reward tracking)
  reward_report_seconds: 60 # log estimated rewards earned
  reselect_interval_seconds: 900
  status_check_interval_seconds: 30

rate_limits:
  read_per_sec: 200
  write_per_sec: 100

selection:
  mode: incentives
  fallback_to_volume: false # in prod, only quote markets that pay rewards
  max_markets: 8 # a bid at p plus an ask at q locks ~(p + 1 - q) = ~$1 per contract: 4 x 4 = ~$16
  max_per_series: 1 # with only 4 markets, spread across unrelated events
  min_seconds_to_close: 21600 # 6h; close_buffer_seconds pulls quotes 2h before close anyway
  min_mid_price: 0.10 # below this a 5c move is a 50%+ loss
  max_mid_price: 0.85
  max_spread: 0.08 # wider books have no trustworthy fair value
  min_daily_reward: 0 # off: $0.40/day for 5 days still pays $2. The payout filter decides
  min_period_payout: 1.25 # projected payout until period end/market close; Kalshi pays nothing under $1.
  # Keep size and this in balance: halving size roughly halves every market's payout.
  exclude_tickers: []

quoting:
  placement: reward
  share_tolerance: 0.25 # accept 25% less reward share for a deeper, safer price
  size: 8 # contracts per side; your reward share scales with it
  offset_ticks: 0
  min_edge: 0.01
  skew_per_contract: 0.005 # 4 contracts held -> quotes shift 2c away
  max_skew: 0.05
  min_price: 0.05
  max_price: 0.95
  one_sided_edge: 0.05
  default_target_size: 500
  default_discount_factor: 0.5
  post_only: true
  min_cushion: 100 # others' contracts ahead of us, capped per market at Target Size / 5 (full credit)
  min_quote_life_seconds: 10 # no reward-chasing moves for 10s (safety moves still immediate)

risk:
  max_capital: 80 # $ cap: position cost + cash locked in resting orders (actual $, per price)
  max_position_per_market: 8 # one full fill; then only the reducing side quotes
  max_total_exposure: 20
  max_session_loss: 8 # halt and cancel everything while validating
  min_balance: 0 # cash floor; max_capital already bounds what the bot uses
  fill_burst_contracts: 2 # any fill of 2+ contracts pauses that market...
  fill_burst_window_seconds: 300
  cooldown_seconds: 600 # ...for 10 minutes
  close_buffer_seconds: 7200
  max_consecutive_errors: 5
  max_mid_move: 0.04 # mid moves 4c within 60s -> news; pause the market
  mid_move_window_seconds: 60
  order_group_contracts_limit: 8 # exchange-side: >2 full fills in 15s cancels everything

logging:
  level: INFO
  file: logs/prod.log
